services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecotrack
      POSTGRES_USER: ecotrack
      POSTGRES_PASSWORD: ecotrack
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ecotrack:ecotrack@postgres:5432/ecotrack
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-secret
    ports: ["8000:8000"]
    depends_on: [postgres,redis]
  celery:
    build: ./backend
    command: celery -A celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://ecotrack:ecotrack@postgres:5432/ecotrack
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres,redis]
  ai-service:
    build: ./ai-service
    ports: ["8001:8001"]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  pgdata:
